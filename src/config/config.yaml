llm:
  model: openai/gpt-5.6-luna
  temperature: 0.7
  maxTokens: 32000
  reasoningEffort: medium # max | xhigh | high | medium | low | minimal

defaultAgent: sonny
agentsPath: agents

contextCompaction:
  contextWindowTokens: 200000
  thresholdRatio: 0.75
  maxToolResultChars: 10000
  protectedHeadMessages: 4
  protectedTailMessages: 6
  summaryMaxTokens: 4000

toolApproval:
  mode: auto # auto | manual
  model: typesafe/jev-1.13 # pinned decision model (OpenRouter Decisions API)
  timeoutMs: 5000
  maxConsecutiveDenials: 3
  userMessageWindow: 3
  maxPayloadChars: 8000
  thresholds:
    allow: { maxDanger: 0.3, minRequested: 0.6 }
    deny: { minDanger: 0.8, maxRequested: 0.3 }

channels:
  telegram:
    enabled: true
    allowedUserIds:
      - "363571486"
